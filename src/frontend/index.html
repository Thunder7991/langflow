<!doctype html>
<html lang="en">
  <head>
    <base href="/" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chivo:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
      rel="stylesheet"
    />
    <script
      src="/node_modules/ace-builds/src-min-noconflict/ace.js"
      type="module"
    ></script>
    <title>Langflow</title>
    <style>
      body {
        background-color: hsl(var(--background, 0 0% 100%));
        color-scheme: light;
      }
      body.dark {
        background-color: hsl(var(--background, 240 6% 10%));
        color-scheme: dark;
      }
    </style>
  </head>
  <body id="body" style="width: 100%; height: 100%">
    <script id="bootstrap-theme">
      // 首次绘制前应用主题，避免等待 React 和语言包期间先展示暗色背景。
      (() => {
        let preference;
        try {
          preference = localStorage.getItem("themePreference");
        } catch {
          // 存储受限时仍按系统主题展示首屏。
        }
        const dark =
          preference === "dark" ||
          (preference !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.body.classList.toggle("dark", dark);
      })();
    </script>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div style="width: 100%; height: 100%" id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
